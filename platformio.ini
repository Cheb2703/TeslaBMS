[env:esp32-s3-devkitc-1]
; Every version below is pinned to exactly what this firmware was built and
; tested with, so a build next year gives the same result as one today. Without
; pins, "latest" is used: newer AsyncTCP / ESPAsyncWebServer releases already
; exist that this code has not been tested against. To upgrade one, change its
; version here, rebuild, and test on the device.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Automatically decodes Guru Meditation Error backtraces into actual
; function names and file:line, instead of raw addresses like 0x4201c8b7.
; Needs debug symbols, which a normal debug build already has -- no other
; change needed. Just re-open the serial monitor (or reconnect the Console
; tab's underlying serial link) after this and trigger the crash again.
monitor_filters = esp32_exception_decoder

; -- N16R8: 16MB Flash (Quad), 8MB Octal PSRAM.
; -- These settings are required for the Arduino core to detect and use the
; -- PSRAM -- without them psramFound() returns false and ESP.getFreePsram()
; -- reports 0, even though the chip physically has PSRAM on board.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM

; AsyncTCP and ESPAsyncWebServer are pinned to their official releases. (The
; commits this firmware was first built from differ from these releases only in
; GitHub CI/example files, not in library code.) Listing AsyncTCP here, at the
; exact version ESPAsyncWebServer asks for, also stops PlatformIO from fetching
; a second, newer copy of it.
lib_deps =
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.4.10
    ESP32Async/ESPAsyncWebServer@3.11.2
    Links2004/WebSockets@2.7.3
    adafruit/Adafruit NeoPixel@1.15.5
    ldab/ESP32_FTPClient@0.1.4
    lovyan03/LovyanGFX@1.2.24