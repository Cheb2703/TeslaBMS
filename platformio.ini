[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Automatically decodes Guru Meditation Error backtraces into actual
; function names and file:line, instead of raw addresses like 0x4201c8b7.
; Needs debug symbols, which a normal debug build already has -- no other
; change needed. Just re-open the serial monitor (or reconnect the Console
; tab's underlying serial link) after this and trigger the crash again.
monitor_filters = esp32_exception_decoder

; -- N16R8: 16MB Flash (Quad), 8MB Octal PSRAM.
; -- These settings are required for the Arduino core to detect and use the
; -- PSRAM -- without them psramFound() returns false and ESP.getFreePsram()
; -- reports 0, even though the chip physically has PSRAM on board.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    Links2004/WebSockets
    adafruit/Adafruit NeoPixel
    ldab/ESP32_FTPClient
    lovyan03/LovyanGFX @ ^1.1.16